name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same pull request cancels the run still going for the older one
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions by the commit they are at (a tag can be moved to other code); .github/dependabot.yml keeps them current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check of every script
        run: for f in public/js/*.js public/js/*/*.js public/sw.js src/*.js src/*/*.js; do node --check "$f" || exit 1; done
      - run: npm test
