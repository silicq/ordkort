name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same pull request cancels the run still going for the older one
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Syntax check of every script
        run: for f in public/js/*.js public/js/*/*.js public/sw.js src/*.js; do node --check "$f" || exit 1; done
      - run: npm test
