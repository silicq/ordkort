ensive to live in Norway."},{"term":"en pose","tr":"bag","forms":"posen, poser, posene","ex":"Trenger du pose?","exTr":"Do you need a bag?"},{"term":"ei handlevogn","tr":"shopping trolley","forms":"handlevognen, handlevogner, handlevognene","ex":"Handlevogna står ved inngangen.","exTr":"The trolley is by the entrance."},{"term":"en kø","tr":"queue","forms":"køen, køer, køene","ex":"Vi sto i kø i ti minutter.","exTr":"We queued for ten minutes."},{"term":"å bytte","tr":"to exchange","forms":"bytter, bytta, har bytta","ex":"Kan jeg bytte genseren?","exTr":"Can I exchange the sweater?"},{"term":"å spare","tr":"to save","forms":"sparer, sparte, har spart","ex":"Vi sparer penger til ferien.","exTr":"We are saving money for the holiday."},{"term":"ei lommebok","tr":"wallet","forms":"lommeboka, lommebøker, lommebøkene","ex":"Jeg har mistet lommeboka.","exTr":"I have lost my wallet."},{"term":"en rabatt","tr":"discount","forms":"rabatten, rabatter, rabattene","ex":"Studenter får ti prosent rabatt.","exTr":"Students get a ten per cent discount."}]</script>
