  <script type="application/json" id="data">[{"term":"en lege","tr":"doctor","forms":"legen, leger, legene","ex":"Jeg må til legen.","exTr":"I have to see the doctor."},{"term":"en fastlege","tr":"regular GP","forms":"fastlegen, fastleger, fastlegene","ex":"Hvem er fastlegen din?","exTr":"Who is your GP?"},{"term":"en legevakt","tr":"out-of-hours clinic","forms":"legevakten, legevakter, legevaktene","ex":"Om natta må du ringe legevakten.","exTr":"At night you have to call the out-of-hours clinic."},{"term":"en time","tr":"appointment","forms":"timen, timer, timene","ex":"Jeg har time klokka tre.","exTr":"I have an appointment at three."},{"term":"et sykehus","tr":"hospital","forms":"sykehuset, sykehus, sykehusene","ex":"Hun ligger på sykehuset.","exTr":"She is in hospital."},{"term":"et apotek","tr":"pharmacy","forms":"apoteket, apotek, apotekene","ex":"Apoteket er åpent til ti.","exTr":"The pharmacy is open until ten."},{"term":"en medisin","tr":"medicine","forms":"medisinen, medisiner, medisinene","ex":"Ta medisinen to ganger om dagen.","exTr":"Take the medicine twice a day."},{"term":"en resept","tr":"prescription","forms":"resepten, resepter, reseptene","ex":"Legen skrev ut en resept.","exTr":"The doctor wrote a prescription."},{"term":"en tablett","tr":"tablet, pill","forms":"tabletten, tabletter, tablettene","ex":"Ta en tablett før maten.","exTr":"Take one tablet before meals."},{"term":"vondt","tr":"pain, sore","forms":"","ex":"Hvor har du vondt?","exTr":"Where does it hurt?"},{"term":"feber","tr":"fever","forms":"feberen, febere, febrene","ex":"Barnet har feber.","exTr":"The child has a fever."},{"term":"en forkjølelse","tr":"cold","forms":"forkjølelsen, forkjølelser, forkjølelsene","ex":"Det er bare en forkjølelse.","exTr":"It is just a cold."},{"term":"en allergi","tr":"allergy","forms":"allergien, allergier, allergiene","ex":"Har du noen allergier?","exTr":"Do you have any allergies?"},{"term":"en sykmelding","tr":"sick note","forms":"sykmeldingen, sykmel
